name: macOS Build
on:
  workflow_dispatch:
  push:
    branches: [master, port/macos-yunet]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'creavision/**'
      - 'wxutil/**'
      - 'wxcamwindow/**'
      - 'simplelog/**'
      - 'models/**'
      - 'tests/**'
      - 'tools/**'
      - 'README-MACOS.md'
      - '.github/workflows/macos-build.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install build tools
        run: brew install cmake ninja
      - name: Restore native dependency cache
        id: cache
        uses: actions/cache@v4
        with:
          path: .deps
          key: macos-15-${{ matrix.arch }}-deps-${{ hashFiles('tools/build-macos-deps.sh') }}
          restore-keys: macos-15-${{ matrix.arch }}-deps-
      - name: Compile static native dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash tools/build-macos-deps.sh
      - name: Save compiled dependencies before application tests
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps
          key: macos-15-${{ matrix.arch }}-deps-${{ hashFiles('tools/build-macos-deps.sh') }}
      - name: Prepare camera-free test fixtures
        run: |
          python -m pip install -r tools/requirements-benchmark.txt
          python tools/prepare_benchmark.py
      - name: Build and test
        run: bash tools/build-macos.sh
      - name: Package and test the standalone app
        run: bash tools/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: eviacam-yunet-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-logs-${{ matrix.arch }}
          path: build-macos/Testing/Temporary/*.log
          if-no-files-found: ignore
